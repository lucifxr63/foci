# ─── Build Settings ───────────────────────────────────────────────────────────
[build]
  base            = ""
  publish         = "dist"
  command         = "npm run build"

# ─── Dev Settings (netlify dev) ───────────────────────────────────────────────
[dev]
  command         = "npm run dev"
  port            = 5173
  targetPort      = 5173
  autoLaunch      = false

# Nota: el sitio es SSG — cada ruta tiene su propio HTML pre-renderizado, así que
# NO usamos SPA fallback. Netlify sirve public/404.html (status 404) en rutas
# inexistentes, evitando "soft 404" que penaliza Google.

# ─── Headers de seguridad ─────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
