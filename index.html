          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La audiometría es un examen que mide con precisión el umbral mínimo de audición para cada frecuencia sonora, realizado en una cabina sonoamortiguada. Permite detectar pérdidas auditivas y trazar un audiograma para diseñar tratamientos o adaptar audífonos. En FOCI realizamos audiometrías por vía aérea y ósea."

          }

          }
        },

          }
        },
