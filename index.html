<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=10" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />

    <!-- El <title>, description, canonical y Open Graph se gestionan por página
         con <Head> (vite-react-ssg). Este index.html es solo la plantilla base;
         el schema MedicalClinic de abajo es global (aplica a todo el sitio). -->

    <!-- Schema.org: MedicalClinic + LocalBusiness (global) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["MedicalClinic", "LocalBusiness"],
      "name": "FOCI — Fonoaudiología Clínica Integral",
      "description": "Centro especializado en evaluaciones auditivas y fonoaudiología clínica en Temuco, Chile. Atención desde los 3 años con tecnología de vanguardia y profesionales certificados.",
      "url": "https://foci.cl",
      "telephone": "+56965545777",
      "email": "contacto@foci.cl",
      "image": "https://foci.cl/logo-foci.png",
      "priceRange": "$$",
      "medicalSpecialty": "Audiology",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "General Mackenna 583, Of. 504",
        "addressLocality": "Temuco",
        "addressRegion": "La Araucanía",
        "postalCode": "4780000",
        "addressCountry": "CL"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": -38.7399896,
        "longitude": -72.5908757
      },
      "openingHoursSpecification": [
        { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday","Wednesday","Friday"], "opens": "09:00", "closes": "19:00" },
        { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Tuesday","Thursday"], "opens": "09:00", "closes": "18:00" },
        { "@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "09:00", "closes": "15:00" }
      ],
      "employee": [
        {
          "@type": "Person",
          "name": "Lesly Villagrán Obreque",
          "jobTitle": "Fonoaudióloga Directora",
          "description": "Especialista en otoscopía y lavado de oídos, directora clínica de FOCI"
        },
        {
          "@type": "Person",
          "name": "Carla Valenzuela",
          "jobTitle": "Fonoaudióloga Clínica",
          "description": "Especialista en lenguaje e intervención, certificada en Escala ADOS-2 y Neurorrehabilitación"
        },
        {
          "@type": "Person",
          "name": "Catalina Herrera",
          "jobTitle": "Fonoaudióloga Clínica",
          "description": "Especialista en trastornos de la deglución (disfagia) y neurorrehabilitación de adultos y adultos mayores, manejo de pacientes traqueostomizados y atención hospitalaria"
        }
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Servicios de Fonoaudiología en Temuco",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "MedicalProcedure", "name": "Consulta General Fonoaudiológica" } },
          { "@type": "Offer", "itemOffered": { "@type": "MedicalProcedure", "name": "Lavado de Oídos (irrigación auricular)" } },
          { "@type": "Offer", "itemOffered": { "@type": "MedicalProcedure", "name": "Audiometría" } },
          { "@type": "Offer", "itemOffered": { "@type": "MedicalTherapy", "name": "Terapia de Lenguaje y Habla Adulto" } },
          { "@type": "Offer", "itemOffered": { "@type": "MedicalTherapy", "name": "Terapia de Lenguaje y Habla Infantojuvenil" } },
          { "@type": "Offer", "itemOffered": { "@type": "MedicalProcedure", "name": "Evaluación ADOS-2 (diagnóstico TEA)" } },
          { "@type": "Offer", "itemOffered": { "@type": "MedicalTherapy", "name": "Rehabilitación Vestibular" } },
          { "@type": "Offer", "itemOffered": { "@type": "MedicalTherapy", "name": "Evaluación y Terapia de Voz" } }
        ]
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
